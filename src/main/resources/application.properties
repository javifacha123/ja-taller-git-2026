spring.application.name=JaTallerGit2026

# ---------- Base de datos H2 (perfil de desarrollo) ----------
# Archivo de H2 dentro de la carpeta data/ del proyecto; AUTO_SERVER deja abrir la consola mientras corre la app
spring.datasource.url=jdbc:h2:file:./data/minecraft-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---------- JPA / Hibernate ----------
# update: crea las tablas si no existen y conserva las filas entre reinicios
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Sin sesión abierta durante la vista: todo lo lazy se resuelve dentro de la transacción
spring.jpa.open-in-view=false

# ---------- Consola H2 ----------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

