spring.application.name=JaTallerGit2026

# ---------- Base de datos H2 (perfil de desarrollo) ----------
# Archivo de H2 dentro de la carpeta data/ del proyecto; AUTO_SERVER deja abrir la consola mientras corre la app
spring.datasource.url=jdbc:h2:file:./data/minecraft-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---------- JPA / Hibernate ----------
# update: crea las tablas si no existen y conserva las filas entre reinicios
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Sin sesión abierta durante la vista: todo lo lazy se resuelve dentro de la transacción
spring.jpa.open-in-view=false

# ---------- Consola H2 ----------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# POO-09: a quién consulta mi escenario (A2 y A3).
# Estos valores se pueden pisar sin recompilar, por ejemplo:
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--companeros.a2.base-url=http://localhost:8081
# ---------------------------------------------------------------------------

# --- A2: Adrian Vera -------------------------------------------------------
# Regla consultada: un monstruo solo puede explotar si esta vivo y es hostil,
# y su potencia no puede superar su maximo.
companeros.a2.nombre=Adrian Vera
companeros.a2.github=Adrian-312
companeros.a2.base-url=http://localhost:8081
companeros.a2.ruta=/minecraft/simulacion/explosion
companeros.a2.regla=Un monstruo vivo y hostil explota con una potencia que no puede superar su maximo
companeros.a2.openapi=http://localhost:8081/v3/api-docs
# Cuerpo que espera Adrian. 'monstruoId' es un id en SU base; el resto sale de mi jugada.
companeros.a2.cuerpo[monstruoId]=1
companeros.a2.cuerpo[potencia]={{potencia}}

# --- A3: Yamil Padilla -----------------------------------------------------
# Regla consultada: el radio de una explosion debe estar en (0, 100] y el dano
# baja linealmente con la distancia al centro.
companeros.a3.nombre=Yamil Padilla
companeros.a3.github=Yamil-Padilla
companeros.a3.base-url=http://localhost:8082
companeros.a3.ruta=/api/explosiones
companeros.a3.regla=El radio de una explosion debe estar en (0, 100] y el dano decae linealmente con la distancia
companeros.a3.openapi=http://localhost:8082/v3/api-docs
# Cuerpo que espera Yamil: coordenadas del centro y radio.
companeros.a3.cuerpo[x]=0.0
companeros.a3.cuerpo[y]=64.0
companeros.a3.cuerpo[z]=0.0
companeros.a3.cuerpo[radio]={{radio}}
